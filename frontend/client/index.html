<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ff6b00">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>建材通 - 本地建材一站购</title>
  <link rel="stylesheet" href="/shared/css/base.css">
</head>
<body>
  <div id="app"></div>

  <nav class="tabbar" id="tabbar">
    <a class="tabbar-item active" data-route="/" onclick="Router.navigate('/')">
      <span class="icon">🏠</span><span>首页</span>
    </a>
    <a class="tabbar-item" data-route="/category" onclick="Router.navigate('/category')">
      <span class="icon">📦</span><span>分类</span>
    </a>
    <a class="tabbar-item" data-route="/cart" onclick="Router.navigate('/cart')">
      <span class="icon">🛒</span><span>购物车</span>
      <span class="badge" id="cartBadge" style="display:none">0</span>
    </a>
    <a class="tabbar-item" data-route="/mine" onclick="Router.navigate('/mine')">
      <span class="icon">👤</span><span>我的</span>
    </a>
  </nav>

  <script src="/shared/js/store.js"></script>
  <script src="/shared/js/http.js"></script>
  <script src="/shared/js/router.js"></script>
  <script src="/shared/js/ui.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
