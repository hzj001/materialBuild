# 独立部署: Elasticsearch + MongoDB
# 项目组名: dlz-tjf-zts (独立网络/卷, 与其他栈隔离)
# 启动: docker compose -f docker-compose.dlz-tjf-zts.yml up -d
name: dlz-tjf-zts

services:
  elasticsearch:
    image: elasticsearch:9.4.2
    container_name: dlz-tjf-zts-es
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 40s
    networks:
      - dlz-tjf-zts-net

  mongodb:
    image: mongo:latest
    container_name: dlz-tjf-zts-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-root123456}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - dlz-tjf-zts-net

  # Kafka (KRaft 模式, 无需 Zookeeper)
  kafka:
    image: docker.1ms.run/apache/kafka:latest
    container_name: dlz-tjf-zts-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@dlz-tjf-zts-kafka:9093
      # 双监听器: 宿主机走 EXTERNAL(localhost:9092), 容器间走 PLAINTEXT(:29092)
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://dlz-tjf-zts-kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - dlz-tjf-zts-net

  # InfluxDB 2.x 时序数据库
  influxdb:
    image: docker.1ms.run/library/influxdb:latest
    container_name: dlz-tjf-zts-influxdb
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USER:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD:-admin123456}
      DOCKER_INFLUXDB_INIT_ORG: dlz-tjf-zts
      DOCKER_INFLUXDB_INIT_BUCKET: default
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:-dlz-tjf-zts-admin-token}
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    healthcheck:
      test: ["CMD-SHELL", "influx ping || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - dlz-tjf-zts-net

  # RocketMQ NameServer (注册中心)
  rmqnamesrv:
    image: docker.1ms.run/apache/rocketmq:5.3.2
    container_name: dlz-tjf-zts-rmqnamesrv
    restart: unless-stopped
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: "-server -Xms256m -Xmx256m -Xmn128m"
    ports:
      - "9876:9876"
    networks:
      - dlz-tjf-zts-net

  # RocketMQ Broker (消息存储)
  rmqbroker:
    image: docker.1ms.run/apache/rocketmq:5.3.2
    container_name: dlz-tjf-zts-rmqbroker
    restart: unless-stopped
    depends_on:
      - rmqnamesrv
    command: sh mqbroker -n dlz-tjf-zts-rmqnamesrv:9876
    user: root
    environment:
      JAVA_OPT_EXT: "-server -Xms512m -Xmx512m -Xmn256m"
    ports:
      - "10911:10911"
      - "10909:10909"
    volumes:
      - rmqbroker_store:/home/rocketmq/store
    networks:
      - dlz-tjf-zts-net

  # RocketMQ Proxy (客户端接入网关, gRPC 8080 / remoting 8081)
  rmqproxy:
    image: docker.1ms.run/apache/rocketmq:5.3.2
    container_name: dlz-tjf-zts-rmqproxy
    restart: unless-stopped
    depends_on:
      - rmqbroker
    command: sh mqproxy -n dlz-tjf-zts-rmqnamesrv:9876
    environment:
      JAVA_OPT_EXT: "-server -Xms512m -Xmx512m -Xmn256m"
    ports:
      - "18080:8080"
      - "18081:8081"
    networks:
      - dlz-tjf-zts-net

networks:
  dlz-tjf-zts-net:
    name: dlz-tjf-zts-net
    driver: bridge

volumes:
  es_data:
    name: dlz-tjf-zts-es-data
  mongo_data:
    name: dlz-tjf-zts-mongo-data
  kafka_data:
    name: dlz-tjf-zts-kafka-data
  influxdb_data:
    name: dlz-tjf-zts-influxdb-data
  influxdb_config:
    name: dlz-tjf-zts-influxdb-config
  rmqbroker_store:
    name: dlz-tjf-zts-rmqbroker-store
